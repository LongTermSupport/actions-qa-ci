name: CI

on:
  pull_request:
  push:
    branches:
      - main
    # A push of documentation alone starts no run on main. The Markdown this program embeds or
    # a release is cut from, and the files agents read as instructions, are code here.
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "docs/rules/**"
      - "CHANGELOG.md"
      - "**/CLAUDE.md"
      - "**/AGENTS.md"
      - ".github/**"

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CI:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Fetch the pinned third-party binaries
        run: go run ./cmd/actions-qa-dev fetch bin

      - name: Test
        run: go test ./...

      - name: Check this repository with its own program
        env:
          ACTIONS_QA_CI_TOOLS_DIR: ${{ github.workspace }}/bin
        run: go run ./cmd/actions-qa check --format agent

      # The release path, proven for a trial version: both bundles, checksums.txt and install.sh
      # as the release workflow builds them, then the action at this commit installing the amd64
      # bundle and checking this repository with the installed program.
      - name: Build the release assets for a trial version
        run: sh scripts/build-release.sh 0.0.0 "$RUNNER_TEMP/trial-release"

      - name: Run the action from this commit against the trial release
        uses: ./
        env:
          ACTIONS_QA_CI_BUNDLE: ${{ runner.temp }}/trial-release/actions-qa-ci_0.0.0_linux_amd64.tar.gz
          ACTIONS_QA_CI_INSTALL_SCRIPT: ${{ runner.temp }}/trial-release/install.sh
        with:
          version: 0.0.0
          args: check --format github
