name: Update tools

# Moves each pinned third-party tool to its latest release once that release is past the
# cooldown, checks the result with this repository's own gate, and proposes it as a pull request.
# It proposes and stops: the pull request is merged by a person or by an agent the Owner has
# authorised, never by this workflow. A pull request opened with the workflow token does not start
# the CI workflow, so the gate is run here, in the job that makes the change, before anything is
# proposed.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-tools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bump:
    name: Bump and check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.moved.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Move the tools that have a release past the cooldown
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/actions-qa-dev tools bump --manifest internal/toolchain/manifest.json > "$RUNNER_TEMP/bump-report.txt"

      - name: Say what moved
        id: moved
        run: |
          cat "$RUNNER_TEMP/bump-report.txt"
          if git diff --quiet -- internal/toolchain/manifest.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Formatting
        if: steps.moved.outputs.changed == 'true'
        run: test -z "$(gofmt -l .)"

      - name: Vet
        if: steps.moved.outputs.changed == 'true'
        run: go vet ./...

      - name: Fetch the pinned third-party binaries
        if: steps.moved.outputs.changed == 'true'
        run: go run ./cmd/actions-qa-dev fetch bin

      - name: Test
        if: steps.moved.outputs.changed == 'true'
        run: go test ./...

      - name: Check this repository with its own program
        if: steps.moved.outputs.changed == 'true'
        env:
          ACTIONS_QA_CI_TOOLS_DIR: ${{ github.workspace }}/bin
        run: go run ./cmd/actions-qa check --format agent

      - name: Keep the proposal
        if: steps.moved.outputs.changed == 'true'
        run: |
          mkdir "$RUNNER_TEMP/proposal"
          cp internal/toolchain/manifest.json "$RUNNER_TEMP/proposal/manifest.json"
          cp "$RUNNER_TEMP/bump-report.txt" "$RUNNER_TEMP/proposal/bump-report.txt"

      - name: Upload the proposal
        if: steps.moved.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proposal
          path: ${{ runner.temp }}/proposal
          if-no-files-found: error

  propose:
    name: Open or update the pull request
    needs: bump
    if: needs.bump.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the proposal
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proposal
          path: ${{ runner.temp }}/proposal

      - name: Commit the proposal to chore/update-tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/proposal/manifest.json" internal/toolchain/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b chore/update-tools
          git add internal/toolchain/manifest.json
          git commit -m "Move the pinned tools to their latest releases" -m "$(cat "$RUNNER_TEMP/proposal/bump-report.txt")"
          credentials="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          # The branch belongs to this workflow and is rebuilt from the default branch each run.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $credentials" push --force origin chore/update-tools

      - name: Open the pull request, or bring the open one up to date
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The pinned tools moved to their latest releases, each past the cooldown."
            echo
            echo '```'
            cat "$RUNNER_TEMP/proposal/bump-report.txt"
            echo '```'
            echo
            echo "The change was checked with formatting, vet, the tests and this repository's own"
            echo "check before it was proposed ($RUN_URL). The CI workflow does not run on a pull"
            echo "request opened with the workflow token. This workflow does not merge it."
          } > "$RUNNER_TEMP/body.md"
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head chore/update-tools --state open --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head chore/update-tools --title "Move the pinned tools to their latest releases" --body-file "$RUNNER_TEMP/body.md"
          fi

  report-failure:
    name: Report a failed update
    needs: [bump, propose]
    if: ${{ always() && (needs.bump.result == 'failure' || needs.propose.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Comment on the open update-tools-failure issue, or open one
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create update-tools-failure --repo "$GITHUB_REPOSITORY" --description "The update-tools workflow failed" --force
          printf 'The update-tools workflow failed: %s\n' "$RUN_URL" > "$RUNNER_TEMP/failure.md"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --label update-tools-failure --state open --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/failure.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label update-tools-failure --title "The update-tools workflow failed" --body-file "$RUNNER_TEMP/failure.md"
          fi
